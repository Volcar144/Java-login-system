# Default settings for the login system
loginAttempts=5
accountsFile=accounts.csv
adminsFile=admins.txt
logFile=login-system.log
lockoutsFile=lockouts.txt

# Settings for password requirements
strengthRequirementsEnabled=true
minLength=8
minNumbers=0
minSymbols=0
minUppercase=1
minLowercase=1

# Advanced password settings
passwordLockoutDurationMinutes=15
passwordLockoutThreshold=5
allowSpecialCharacters=true
requireSpecialCharacters=false
requireNumeric=false
requireUppercase=false
requireLowercase=false
passwordComplexityLevel=2
